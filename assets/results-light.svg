<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Communication over three short turns, ten runs per version: 0.7.0 against the current version</title>
  <style>
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .grid { stroke: #d1d9e0; }
    .bar { stroke: #afb8c1; }
    .old { fill: #8c959f; }
    .new { fill: #0969da; }
    .ring { stroke: #ffffff; }
  </style>

  <text x="24" y="34" font-size="18" font-weight="600" class="ink">How often the agent got it wrong, out of 10 runs</text>
  <text x="24" y="56" font-size="13" class="muted">Three short turns ("commit", "push", "I published it"), same model, skill version swapped. Fewer is better.</text>

  <circle cx="30" cy="82" r="6" class="old"/>
  <text x="42" y="86" font-size="13" class="ink">0.7.0</text>
  <circle cx="102" cy="82" r="6" class="new"/>
  <text x="114" y="86" font-size="13" class="ink">Current</text>

  <g font-size="12" class="muted" text-anchor="middle">
    <line x1="330" y1="108" x2="330" y2="276" class="grid"/>
    <line x1="530" y1="108" x2="530" y2="276" class="grid" stroke-dasharray="3 3"/>
    <line x1="730" y1="108" x2="730" y2="276" class="grid" stroke-dasharray="3 3"/>
    <text x="330" y="294">0</text>
    <text x="530" y="294">5</text>
    <text x="730" y="294">10</text>
  </g>

  <g font-size="14">
    <text x="24" y="134" class="ink">Unexplained IDs in the validation line</text>
    <line x1="370" y1="130" x2="330" y2="130" class="bar" stroke-width="3"/>
    <circle cx="370" cy="130" r="7" class="old ring" stroke-width="2"/>
    <circle cx="330" cy="130" r="7" class="new ring" stroke-width="2"/>
    <text x="388" y="134" font-size="13" class="muted">1 → 0</text>

    <text x="24" y="174" class="ink">Repeats an unchanged blocked item</text>
    <line x1="370" y1="170" x2="450" y2="170" class="bar" stroke-width="3"/>
    <circle cx="370" cy="170" r="7" class="old ring" stroke-width="2"/>
    <circle cx="450" cy="170" r="7" class="new ring" stroke-width="2"/>
    <text x="468" y="174" font-size="13" class="muted">1 → 3</text>

    <text x="24" y="214" class="ink">Mentions blocked items nobody asked about</text>
    <line x1="370" y1="210" x2="530" y2="210" class="bar" stroke-width="3"/>
    <circle cx="370" cy="210" r="7" class="old ring" stroke-width="2"/>
    <circle cx="530" cy="210" r="7" class="new ring" stroke-width="2"/>
    <text x="548" y="214" font-size="13" class="muted">1 → 5</text>

    <text x="24" y="254" class="ink">Leaves an ID without its meaning</text>
    <line x1="610" y1="250" x2="690" y2="250" class="bar" stroke-width="3"/>
    <circle cx="610" cy="250" r="7" class="old ring" stroke-width="2"/>
    <circle cx="690" cy="250" r="7" class="new ring" stroke-width="2"/>
    <text x="708" y="254" font-size="13" class="muted">7 → 9</text>
  </g>

  <text x="24" y="318" font-size="12" class="muted">Claude Haiku, 10 runs per version. The current version reopens a criterion when its code changes, which gives it more to report.</text>
</svg>
