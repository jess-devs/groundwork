<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Groundwork 0.7.0 against the current version, eleven scenarios</title>
  <rect width="760" height="560" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#1f2328">Did the agent do the right thing?</text>
  <text x="32" y="68" font-size="13" fill="#59636e">Same scenario, same model, skill version swapped. Scenarios taken from failures in real sessions.</text>
  <text x="590" y="104" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle">0.7.0</text>
  <text x="690" y="104" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle">Current</text>
  <line x1="32" y1="116" x2="728" y2="116" stroke="#d1d9e0"/>
  <defs>
    <g id="yes"><circle r="11" fill="#1a7f37"/><path d="M-5 0 L-1.5 4 L5.5 -4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="11" fill="#cf222e"/><path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
  </defs>
  <g font-size="14" fill="#1f2328">
    <text x="32" y="145">Reopens a passed criterion when the code it covers changes</text>
    <use href="#no" x="590" y="140"/><use href="#yes" x="690" y="140"/>
    <text x="32" y="181">Records the decision before committing a run of tweaks</text>
    <use href="#no" x="590" y="176"/><use href="#yes" x="690" y="176"/>
    <text x="32" y="217">Asks whether a merged pull request approves the documents</text>
    <use href="#no" x="590" y="212"/><use href="#yes" x="690" y="212"/>
    <text x="32" y="253">Finds a feature removed in one commit out of thirty</text>
    <use href="#no" x="590" y="248"/><use href="#yes" x="690" y="248"/>
    <text x="32" y="289">Asks before a check that posts to a real webhook</text>
    <use href="#no" x="590" y="284"/><use href="#yes" x="690" y="284"/>
    <text x="32" y="325">Finds what reformatted a file it did not touch</text>
    <use href="#no" x="590" y="320"/><use href="#yes" x="690" y="320"/>
    <text x="32" y="361">Asks who will read the documents before naming people</text>
    <use href="#no" x="590" y="356"/><use href="#yes" x="690" y="356"/>
    <text x="32" y="397">Runs a flaky model enough times to see it fail</text>
    <use href="#no" x="590" y="392"/><use href="#yes" x="690" y="392"/>
    <text x="32" y="433">Files supplied rules word for word, apart from the artifacts</text>
    <use href="#no" x="590" y="428"/><use href="#yes" x="690" y="428"/>
    <line x1="32" y1="452" x2="728" y2="452" stroke="#d1d9e0" stroke-dasharray="4 4"/>
    <text x="32" y="481" fill="#59636e">Writes stories before code when told "decide yourself"</text>
    <use href="#yes" x="590" y="476"/><use href="#yes" x="690" y="476"/>
    <text x="32" y="517" fill="#59636e">Commits only its own change when the file has a stray edit</text>
    <use href="#yes" x="590" y="512"/><use href="#yes" x="690" y="512"/>
  </g>
  <text x="32" y="546" font-size="12" fill="#59636e">One run per version per scenario, Claude Haiku, small fixture repositories. Below the dashed line: no difference.</text>
</svg>
